name: Offline research checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 30 || 20 }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      NUMEXPR_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - name: Create isolated test environment
        run: |
          python -m venv .ci-venv
          python -c "import os; from pathlib import Path; p=Path('.ci-venv')/('Scripts' if os.name=='nt' else 'bin'); Path(os.environ['GITHUB_PATH']).open('a').write(str(p.resolve())+'\n')"
      - name: Install pinned full-suite dependencies
        run: python -m pip install -r requirements-ci.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Verify required investigation imports
        run: python -c "import jsonschema, mcp, httpx, fastapi, numpy, pandas, sklearn, torch; from app.investigation.v3 import delivery, output; print('Required offline runtime imports available')"
      - name: Collect all offline tests
        run: python -B -m pytest --collect-only -q -p no:cacheprovider
      - name: Run V3 protocol tests
        run: python -B -m pytest tests/test_v3_reliability.py tests/test_v3_tasks.py tests/test_v3_pilot_ledger.py -q -p no:cacheprovider --junitxml=v3-test-results.xml
      - name: Run offline fixture and HTTP mock tests
        run: python -B -m pytest -q -p no:cacheprovider --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: |
            test-results.xml
            v3-test-results.xml
